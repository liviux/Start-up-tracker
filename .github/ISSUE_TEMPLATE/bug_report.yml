name: Bug report
description: Something in Startup Tracker does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste data from your own tracker, names, e-mail addresses or file paths from your computer. If you can, reproduce the problem with the demo data (`node tools/demo-data.js --data-dir <folder>`).

        Security problems go through private reporting instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Startup Tracker version
      description: Shown in Settings > About, or run `startup-tracker version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Only if the problem is in the page.
  - type: textarea
    id: logs
    attributes:
      label: Server log, doctor output or browser console
      description: "`startup-tracker logs` and `startup-tracker doctor` help. Remove anything personal before you paste it."
      render: text
